<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      /* 码 + 原文在左，码制切换在右：按钮留在码框外面，不压进二维码区域 */
      #top {
        display: flex;
        align-items: flex-end;
        gap: 0.75rem;
      }
      /* 码与原文竖排 */
      #col {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      /* 码制切换：两个按钮并列，选中的用深底白字。
         Data Matrix 尚未实现，切换只改选中态。 */
      #modes {
        flex: none;
        display: flex;
        /* 左移 40px：探进码框右侧约 28px，距黑区只剩 4px。
           上限是 gap 12px + 静区 32px = 44px，再往左就压到模块上了 */
        margin-left: -2.5rem;
      }
      #modes button {
        /* 固定宽度：选中态变化不会改变整体布局宽度 */
        width: 3rem;
        white-space: nowrap;
        font-size: 0.8rem;
        padding: 0.2rem 0.25rem;
        border: 1px solid #999;
        background: #fff;
        color: #333;
        cursor: pointer;
      }
      #modes button:first-child {
        border-radius: 999px 0 0 999px;
      }
      #modes button:last-child {
        border-radius: 0 999px 999px 0;
        border-left: none;
      }
      #modes button[aria-pressed='true'] {
        background: #333;
        border-color: #333;
        color: #fff;
      }
      #container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: max-content;
      }
      /* 静区靠这里的白底提供；SVG 本身不含背景色 */
      #box {
        background: #fff;
        line-height: 0;
      }
      /* 码下面的原文：与码同宽、居中，长了自动换行 */
      #text {
        max-width: 296px;
        /* 抵掉码的静区 32px 与 gap 16px，让文字紧贴码底 */
        margin-top: -2.5rem;
        /* 固定两行高度：内容长短不再顶动下面的输入框与按钮 */
        height: 2.4em;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        color: #555;
        font-size: 0.95rem;
        text-align: center;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="top">
        <div id="col">
          <div id="box">qrcode</div>
          <div id="text"></div>
        </div>
        <div id="modes" role="group" aria-label="码制：QR 或 DM（Data Matrix）">
          <button type="button" aria-pressed="true">QR</button>
          <button type="button" aria-pressed="false">DM</button>
        </div>
      </div>
      <input placeholder="type the text" />
      <button id="render">Btn</button>
      <button id="export">导出图片</button>
      <button id="copy">复制图片</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
